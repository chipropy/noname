<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>APF TV · Stream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        .player-wrapper {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            position: relative;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            background: #000;
        }
        .error-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f87171;
            font-size: 1rem;
            text-align: center;
            padding: 1rem;
            backdrop-filter: blur(4px);
            pointer-events: none;
            font-family: monospace;
        }
        .loading {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: #aaa;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 20px;
            pointer-events: none;
            font-family: monospace;
        }
    </style>
</head>
<body>
<div class="player-wrapper">
    <video id="video" controls playsinline autoplay></video>
    <div id="loadingMsg" class="loading">🔄 iniciando...</div>
</div>

<!-- Librerías -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // ---------- CONFIGURACIÓN (del bundle) ----------
    const SUPABASE_URL = "https://zzxyeihiqslboxjeidsa.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp6eHllaWhpcXNsYm94amVpZHNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgzNzMzMTYsImV4cCI6MjA3Mzk0OTMxNn0.B354mvjXGSz7G902w_HAU8yGTgZwiVlp6L5BU_OdnOI";
    const API_BASE = "https://api.apftv.live";
    
    // Credenciales corregidas
    const EMAIL = "guachoo@yopmail.om";
    const PASSWORD = "Mi.xiaomi16";
    
    const video = document.getElementById('video');
    const loadingDiv = document.getElementById('loadingMsg');
    
    function setLoading(text, isError = false) {
        loadingDiv.textContent = text;
        loadingDiv.style.color = isError ? '#f87171' : '#aaa';
        if (isError) {
            // Mostrar error más visible
            const existingError = document.querySelector('.error-overlay');
            if (!existingError) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-overlay';
                errorDiv.innerHTML = `⚠️ ${text}<br><small>recargando en 3s...</small>`;
                document.querySelector('.player-wrapper').appendChild(errorDiv);
                setTimeout(() => location.reload(), 3000);
            }
        }
    }
    
    async function init() {
        setLoading("autenticando...");
        
        // 1. Login con Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let session = null;
        try {
            const { data, error } = await supabase.auth.signInWithPassword({
                email: EMAIL,
                password: PASSWORD
            });
            if (error) throw error;
            session = data.session;
            setLoading("obteniendo stream...");
        } catch (err) {
            console.error(err);
            setLoading(`login falló: ${err.message}`, true);
            return;
        }
        
        // 2. Obtener URL del stream (endpoint principal)
        let streamUrl = null;
        try {
            const resp = await fetch(`${API_BASE}/stream/url`, {
                headers: { "Authorization": `Bearer ${session.access_token}` }
            });
            if (resp.ok) {
                const json = await resp.json();
                streamUrl = json.url || json.stream_url || json.hls_url;
            } else {
                throw new Error(`API ${resp.status}`);
            }
        } catch (err) {
            console.warn("fallo /stream/url, probando tabla streams...", err);
            // Fallback: consultar tabla 'streams' directamente en Supabase
            try {
                const { data, error } = await supabase
                    .from('streams')
                    .select('url, stream_url, hls_url')
                    .eq('user_id', session.user.id)
                    .maybeSingle();
                if (!error && data) {
                    streamUrl = data.url || data.stream_url || data.hls_url;
                }
            } catch (e) {}
        }
        
        if (!streamUrl) {
            setLoading("no se encontró el stream", true);
            return;
        }
        
        // 3. Reproducir con HLS.js
        setLoading("cargando stream...");
        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                setLoading("🔴 en vivo");
                video.play().catch(e => setLoading("autoplay bloqueado", false));
                // Ocultar mensaje de carga después de 2s
                setTimeout(() => { loadingDiv.style.opacity = '0'; }, 2000);
            });
            hls.on(Hls.Events.ERROR, (_, data) => {
                if (data.fatal) {
                    setLoading(`error de stream`, true);
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            setLoading("🔴 en vivo (HLS nativo)");
            video.play().catch(e => setLoading("autoplay bloqueado", false));
        } else {
            setLoading("navegador incompatible", true);
        }
    }
    
    init();
</script>
</body>
</html>
