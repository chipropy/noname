<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APF TV - Reproductor vía Supabase</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        /* (mismo estilo que antes, o más compacto) */
        body { font-family: system-ui; background: #0a0f1e; color: white; padding: 2rem; }
        .card { max-width: 1000px; margin: auto; background: #1e293b; border-radius: 1.5rem; padding: 1.5rem; }
        video { width: 100%; aspect-ratio: 16/9; background: black; border-radius: 1rem; }
        button { background: #3b82f6; border: none; padding: 0.5rem 1rem; border-radius: 2rem; color: white; cursor: pointer; }
        .log { background: #0f172a; padding: 1rem; border-radius: 1rem; font-family: monospace; font-size: 0.8rem; max-height: 200px; overflow: auto; }
        input { background: #0f172a; border: 1px solid #334155; padding: 0.5rem; border-radius: 2rem; color: white; width: 100%; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
<div class="card">
    <h1>📡 APF TV · Stream (Supabase directo)</h1>
    <div>
        <input type="email" id="email" placeholder="Email" value="guachoo@yopmail.com">
        <input type="password" id="password" placeholder="Contraseña" value="Mi.xiaomi16">
        <button id="loginBtn">🔐 Login con Supabase</button>
        <button id="reloadBtn" disabled>🔄 Recargar stream</button>
    </div>
    <div class="player-container" style="margin-top: 1rem;">
        <video id="video" controls></video>
    </div>
    <div class="log" id="log">⚡ Esperando acción...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
    // Datos del bundle
    const SUPABASE_URL = "https://zzxyeihiqslboxjeidsa.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp6eHllaWhpcXNsYm94amVpZHNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgzNzMzMTYsImV4cCI6MjA3Mzk0OTMxNn0.B354mvjXGSz7G902w_HAU8yGTgZwiVlp6L5BU_OdnOI";
    
    let supabase = null;
    let currentSession = null;
    let currentStreamUrl = null;
    let player = null;
    const videoEl = document.getElementById('video');
    const logDiv = document.getElementById('log');
    
    function addLog(msg, isError = false) {
        const p = document.createElement('div');
        p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        p.style.color = isError ? '#f87171' : '#a5f3c3';
        logDiv.appendChild(p);
        logDiv.scrollTop = logDiv.scrollHeight;
        console.log(msg);
    }
    
    async function loginSupabase(email, password) {
        addLog(`🔐 Intentando login con ${email} vía Supabase...`);
        try {
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            addLog(`✅ Login exitoso. Usuario: ${data.user.email} (${data.user.id})`);
            currentSession = data.session;
            return data.session;
        } catch (err) {
            addLog(`❌ Error login Supabase: ${err.message}`, true);
            return null;
        }
    }
    
    async function fetchStreamUrlFromSupabase(session) {
        // Primero intentamos obtener la URL desde la API personalizada usando el token de Supabase
        // O bien consultar directamente una tabla pública (ej: 'streams', 'channels')
        // Como no conocemos el esquema exacto, probamos ambos:
        
        // Opción A: Llamar a /stream/url con el token de Supabase (igual que antes, pero ahora el token es JWT de Supabase)
        try {
            addLog("📡 Intentando endpoint /stream/url con token Supabase...");
            const resp = await fetch("https://api.apftv.live/stream/url", {
                headers: { "Authorization": `Bearer ${session.access_token}` }
            });
            if (resp.ok) {
                const data = await resp.json();
                addLog("Respuesta API: " + JSON.stringify(data).substring(0, 200));
                const url = data.url || data.stream_url || data.hls_url;
                if (url) return url;
            } else {
                addLog(`Endpoint devolvió ${resp.status}: ${await resp.text()}`, true);
            }
        } catch(e) { addLog(`Error llamando a API: ${e.message}`, true); }
        
        // Opción B: Consultar tabla 'streams' (asumiendo estructura)
        try {
            addLog("🔍 Buscando en tabla 'streams' de Supabase...");
            const { data, error } = await supabase
                .from('streams')
                .select('url, stream_url, hls_url')
                .eq('user_id', session.user.id)
                .maybeSingle();
            if (!error && data) {
                const url = data.url || data.stream_url || data.hls_url;
                if (url) return url;
            }
        } catch(e) { addLog(`Error tabla streams: ${e.message}`, true); }
        
        // Opción C: Tabla 'channels' o 'live'
        try {
            addLog("🔍 Buscando en tabla 'channels'...");
            const { data, error } = await supabase
                .from('channels')
                .select('stream_url, hls_url, url')
                .eq('owner_id', session.user.id)
                .maybeSingle();
            if (!error && data) {
                const url = data.stream_url || data.hls_url || data.url;
                if (url) return url;
            }
        } catch(e) {}
        
        return null;
    }
    
    function initPlayer(url) {
        if (player && typeof player.dispose === 'function') player.dispose();
        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(videoEl);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                addLog("🎬 Stream listo, reproduciendo...");
                videoEl.play().catch(e => addLog("Autoplay bloqueado: " + e.message));
            });
            hls.on(Hls.Events.ERROR, (_, data) => addLog(`HLS error: ${data.type}`, true));
            player = { hls };
        } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
            videoEl.src = url;
            addLog("Usando HLS nativo");
            player = { native: true };
        } else {
            addLog("Navegador no soporta HLS", true);
        }
    }
    
    document.getElementById('loginBtn').onclick = async () => {
        const email = document.getElementById('email').value;
        const pwd = document.getElementById('password').value;
        if (!supabase) {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
        const session = await loginSupabase(email, pwd);
        if (!session) return;
        const streamUrl = await fetchStreamUrlFromSupabase(session);
        if (streamUrl) {
            currentStreamUrl = streamUrl;
            addLog(`📺 URL obtenida: ${streamUrl}`);
            initPlayer(streamUrl);
            document.getElementById('reloadBtn').disabled = false;
        } else {
            addLog("No se pudo obtener URL del stream. Revisa permisos o estructura de tablas.", true);
        }
    };
    
    document.getElementById('reloadBtn').onclick = async () => {
        if (!currentSession) return;
        const newUrl = await fetchStreamUrlFromSupabase(currentSession);
        if (newUrl) initPlayer(newUrl);
    };
    
    addLog("✅ Preparado. Introduce credenciales y haz login.");
</script>
</body>
</html>
