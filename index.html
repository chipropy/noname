<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>APF TV · Reproductor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .player-wrapper {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            background: #000;
        }
    </style>
</head>
<body>
<div class="player-wrapper">
    <video id="video" controls playsinline autoplay></video>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
    // Credenciales fijas (las que funcionan con login API)
    const EMAIL = "guachoo@yopmail.om";
    const PASSWORD = "Mi.xiaomi16";
    const API_BASE = "https://api.apftv.live";

    const video = document.getElementById('video');

    async function startStream() {
        try {
            // 1. Login vía API
            const loginRes = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: EMAIL, password: PASSWORD })
            });
            if (!loginRes.ok) throw new Error(`Login falló: ${loginRes.status}`);
            const loginData = await loginRes.json();
            const token = loginData.token || loginData.access_token;
            if (!token) throw new Error('No se recibió token');

            // 2. Obtener URL del stream
            const streamRes = await fetch(`${API_BASE}/stream/url`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!streamRes.ok) throw new Error(`Stream endpoint error: ${streamRes.status}`);
            const streamData = await streamRes.json();
            const streamUrl = streamData.url || streamData.stream_url || streamData.hls_url;
            if (!streamUrl) throw new Error('No se encontró URL de stream');

            // 3. Reproducir con HLS.js
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.warn('Autoplay bloqueado:', e));
                });
                hls.on(Hls.Events.ERROR, (_, data) => {
                    if (data.fatal) console.error('Error HLS fatal:', data);
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.play().catch(e => console.warn('Autoplay bloqueado:', e));
            } else {
                throw new Error('Navegador no soporta HLS');
            }
        } catch (err) {
            console.error('Error:', err);
            // Opcional: mostrar algo mínimo si quieres, pero por pedido, sin interfaz de error.
            // Si quieres un mensaje transparente, puedes agregar un div, pero lo dejo sin nada.
        }
    }

    startStream();
</script>
</body>
</html>
